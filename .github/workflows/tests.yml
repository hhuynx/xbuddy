name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: xbuddy_ci
          POSTGRES_PASSWORD: ci-only-not-for-production
          POSTGRES_DB: xbuddy_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xbuddy_ci -d xbuddy_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      XBUDDY_TEST_DATABASE_URL: postgresql://xbuddy_ci:ci-only-not-for-production@127.0.0.1:5432/xbuddy_ci
      XBUDDY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LLM_API_KEY: ''
      FUYAO_API_KEY: ''
      IFIND_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q server scripts tests
      - name: Enable pgvector in disposable CI database
        run: |
          python -c "import os, psycopg; c=psycopg.connect(os.environ['XBUDDY_TEST_DATABASE_URL'],autocommit=True); c.execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close()"
      - name: Audit source and tracked files
        run: |
          python scripts/audit_publication.py
          python scripts/audit_git_index.py
      - name: Test synthetic model and financial contracts
        run: python -m pytest tests -q
